<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Blackjack Caving</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: monospace;
            background: #f4f4f4;
            color: #111;
            overflow: hidden;
        }

        #game {
            position: relative;

            width: min(1100px, 96vw);
            height: 100vh;
            margin: auto;
            padding: 12px 0;

            display: flex;
            flex-direction: column;

            /* #game is now the scroll container */
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* =========================
           TOP BAR
           ========================= */

        #top-bar {
            position: sticky;
            top: 0;
            z-index: 20;

            background: #f4f4f4;

            flex-shrink: 0;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 22px;
            margin: 0;
        }

        #stats {
            display: flex;
            gap: 30px;
            font-size: 20px;
            font-weight: bold;
        }

        #timer {
            min-width: 55px;
            text-align: right;
        }

        /* =========================
           CURRENT WORD
           ========================= */

        #current-word-container {
            height: 45px;
            flex-shrink: 0;
            text-align: center;
            cursor: pointer;
        }

        #current-word {
            height: 28px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        #message {
            height: 17px;
            font-size: 13px;
        }

        /* Hidden text input used to summon the mobile keyboard.
           It is fixed to the viewport so focusing it cannot scroll
           the page back to the top. */
        #hidden-input {
            position: fixed;
            left: 0;
            bottom: 0;

            width: 1px;
            height: 1px;

            padding: 0;
            margin: 0;
            border: none;
            outline: none;
            box-shadow: none;
            background: transparent;

            caret-color: transparent;
            -webkit-tap-highlight-color: transparent;

            opacity: 0;

            /* prevents iOS auto-zoom on focus */
            font-size: 16px;

            pointer-events: none;
        }

        /* =========================
           PUZZLES
           ========================= */

        #puzzles {
            flex: 1;
            min-height: 0;

            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, minmax(0, 1fr));

            gap: 8px;
        }

        .puzzle {
            min-height: 0;
            background: white;
            border: 1px solid #bbb;
            border-radius: 6px;

            padding: 8px;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow: hidden;
        }

        .puzzle.solved {
            background: #e8e8e8;
        }

        .puzzle.bonus {
            background: #f7f7f7;
        }

        .bonus-container {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
        }

        .bonus-word {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0;
            margin: 0;
            flex-shrink: 0;
            display: block;
            text-align: center;
        }

        .bonus-label {
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 0;
            margin: 0;
            display: block;
            text-align: center;
        }

        .puzzle-number {
            color: #777;
            font-size: 11px;
            flex-shrink: 0;
        }

        .puzzle-word {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            margin: 2px 0;
            flex-shrink: 0;
        }

        .puzzle-status {
            font-size: 11px;
            color: #555;
            text-align: center;
            flex-shrink: 0;
        }

        /* =========================
           SOLUTION / SCORE BREAKDOWN
           ========================= */

        .solution {
            margin-top: 5px;
            width: 100%;
            text-align: left;
            font-size: 11px;
            line-height: 1.3;
            flex-shrink: 0;
        }

        .solution-word {
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .solution-total {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .score-breakdown {
            width: fit-content;
            margin: 0 auto;
        }

        .score-line {
            display: grid;
            grid-template-columns: 10ch 5ch;
            column-gap: 1ch;
        }

        .score-label {
            text-align: left;
            white-space: nowrap;
        }

        .score-value {
            text-align: right;
        }

        /* =========================
           ANSWERS
           ========================= */

        .answers-container {
            width: 100%;
            min-height: 0;
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            margin-top: 4px;
        }

        .show-answers {
            font-family: monospace;
            font-size: 11px;

            background: #eee;
            color: #111;

            border: 1px solid #aaa;
            border-radius: 4px;

            padding: 4px 7px;
            cursor: pointer;
        }

        .show-answers:hover {
            background: #ddd;
        }

        .answers {
            width: 100%;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            margin-top: 4px;
            padding: 3px;

            font-size: 10px;
            line-height: 1.35;

            border-top: 1px solid #ddd;

            word-break: break-word;
        }

        /* =========================
           GAME OVER
           ========================= */

        #game-over {
            display: none;

            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);

            text-align: center;
            padding: 0;

            z-index: 10;
        }

        #game-over h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        #final-score {
            font-size: 14px;
            margin-bottom: 6px;
        }

        #restart {
            font-family: monospace;
            font-size: 14px;

            background: white;
            color: #111;

            border: 1px solid #999;
            border-radius: 4px;

            padding: 6px 14px;
            cursor: pointer;
        }

        #restart:hover {
            background: #eee;
        }

        /* =========================
           SMALL SCREENS
           ========================= */

        @media (max-width: 800px) {

            #puzzles {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(5, minmax(180px, 1fr));
            }

            #stats {
                gap: 15px;
            }

            /* Only hint at tap-to-type on touch-sized screens;
               desktop users just start typing. */
            #current-word:empty::before {
                content: "tap here & type";
                color: #aaa;
                font-weight: normal;
                letter-spacing: 0;
                font-size: 14px;
            }

            /* On mobile the game-over panel stays in normal flow
               so it doesn't cover the puzzles. */
            #game-over {
                position: static;
                transform: none;
                margin: 10px 0;
                background: white;
                border: 1px solid #bbb;
                border-radius: 6px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <div id="top-bar">
        <div id="header">
            <h1>Blackjack Caving</h1>

            <div id="stats">
                <div id="timer">2:00</div>
                <div id="score">0</div>
            </div>
        </div>

        <div id="current-word-container">
            <div id="current-word"></div>
            <div id="message"></div>
        </div>
    </div>

    <!-- Hidden input used only to summon the on-screen keyboard on mobile. -->
    <input
        id="hidden-input"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        inputmode="text"
        enterkeyhint="done"
        maxlength="30"
        tabindex="-1"
    >

    <div id="puzzles"></div>

    <div id="game-over">
        <h2>Time's Up!</h2>
        <div id="final-score"></div>
        <button id="restart">Play Again</button>
    </div>

</div>


<script>
"use strict";


/* ============================================================
   WORD LIST
   ============================================================ */

let wordList = [];
let wordSet = new Set();


/* ============================================================
   SUBSEQUENCE TEST
   ============================================================ */

function substr(small, big) {
    let j = 0;

    for (let i = 0; i < big.length && j < small.length; i++) {
        if (big[i] === small[j]) {
            j++;
        }
    }

    return j === small.length;
}


/* ============================================================
   ANSWERS
   ============================================================ */

function answers(sub) {
    const result = [];

    for (const word of wordList) {

        if (word.length < sub.length) {
            continue;
        }

        if (substr(sub, word)) {
            result.push(word);
        }
    }

    return result;
}


/* ============================================================
   RANDOM PUZZLE
   ============================================================ */

function randomRack() {

    const length = Math.min(
        4,
        Math.floor(Math.random() * 3) + 3
    );

    let result = "";

    for (let i = 0; i < length; i++) {
        result += String.fromCharCode(
            65 + Math.floor(Math.random() * 26)
        );
    }

    return result;
}


/* ============================================================
   GENERATE 10 PUZZLES
   ============================================================ */

function generatePuzzles() {

    const puzzles = [];

    for (let i = 0; i < 10; i++) {

        while (true) {

            const rack = randomRack();
            const ans = answers(rack);

            /*
                Need at least 15 possible answers,
                all of which are 6+ letters.
            */

            if (
                ans.length < 15 ||
                ans.some(word => word.length < 6)
            ) {
                continue;
            }

            puzzles.push({
                rack: rack,
                answers: ans,

                solution: null,

                points: 0,

                solved: false,
                bonusWord: null
            });

            break;
        }
    }

    /*
        Harder puzzles (fewer answers) first.
    */

    puzzles.sort((a, b) =>
        b.answers.length - a.answers.length
    );

    return puzzles;
}


/* ============================================================
   GAME STATE
   ============================================================ */

let puzzles = [];

let score = 0;

let currentWord = "";

let timeRemaining = 120;

let timerInterval = null;

let gameActive = false;


/* ============================================================
   DISPLAY
   ============================================================ */

function updateScore() {
    document.getElementById("score").textContent =
        score;
}


function updateCurrentWord() {
    document.getElementById("current-word").textContent =
        currentWord;
}


function updateTimer() {

    const minutes =
        Math.floor(timeRemaining / 60);

    const seconds =
        timeRemaining % 60;

    document.getElementById("timer").textContent =
        `${minutes}:${seconds.toString().padStart(2, "0")}`;
}


/* ============================================================
   PUZZLE RENDERING
   ============================================================ */

function renderPuzzles() {

    const container =
        document.getElementById("puzzles");

    container.innerHTML = "";

    puzzles.forEach((puzzle, index) => {

        const div =
            document.createElement("div");

        div.className = "puzzle";

        if (puzzle.solved) {
            div.classList.add("solved");
        } else if (puzzle.bonusWord) {
            div.classList.add("bonus");
        }


        /*
            Puzzle number.
        */

        const number =
            document.createElement("div");

        number.className =
            "puzzle-number";

        number.textContent =
            `PUZZLE ${index + 1}`;

        div.appendChild(number);


        /*
            Puzzle letters.
        */

        const rack =
            document.createElement("div");

        rack.className =
            "puzzle-word";

        rack.textContent =
            puzzle.rack;

        div.appendChild(rack);


        /*
            Status.
        */

        const status =
            document.createElement("div");

        status.className =
            "puzzle-status";

        status.textContent =
            `${puzzle.answers.length} words`;

        div.appendChild(status);


        /*
            Bonus word.
        */

        if (puzzle.bonusWord) {

            const bonus =
                document.createElement("div");

            bonus.className =
                "bonus-container";

            const bonusWord =
                document.createElement("span");

            bonusWord.className =
                "bonus-word";

            bonusWord.textContent =
                puzzle.bonusWord;

            const bonusLabel =
                document.createElement("span");

            bonusLabel.className =
                "bonus-label";

            bonusLabel.textContent =
                "(bonus word)";

            bonus.appendChild(bonusWord);
            bonus.appendChild(bonusLabel);

            div.appendChild(bonus);
        }


        /*
            Show current solution and scoring breakdown.
        */

        if (puzzle.solved) {

            const solution =
                document.createElement("div");

            solution.className =
                "solution";


            /*
                Word.
            */

            const word =
                document.createElement("div");

            word.className =
                "solution-word";

            word.textContent =
                puzzle.solution;

            solution.appendChild(word);


            /*
                Total score.
            */

            const total =
                document.createElement("div");

            total.className =
                "solution-total";

            total.textContent =
                `+${puzzle.points.total}`;

            solution.appendChild(total);


            /*
                Breakdown.
            */

            const breakdown =
                document.createElement("div");

            breakdown.className =
                "score-breakdown";


            function addScoreLine(label, value) {

                const line =
                    document.createElement("div");

                line.className =
                    "score-line";


                const labelElement =
                    document.createElement("span");

                labelElement.className =
                    "score-label";

                labelElement.textContent =
                    label;


                const valueElement =
                    document.createElement("span");

                valueElement.className =
                    "score-value";

                valueElement.textContent =
                    `+${value}`;


                line.appendChild(labelElement);
                line.appendChild(valueElement);

                breakdown.appendChild(line);
            }


            /*
                Base.
            */

            addScoreLine(
                "base",
                puzzle.points.base
            );


            /*
                Shortest.
            */

            if (puzzle.points.shortest > 0) {

                addScoreLine(
                    "shortest",
                    puzzle.points.shortest
                );
            }


            /*
                Length bonus.
            */

            if (puzzle.points.lengthBonus > 0) {

                addScoreLine(
                    "length",
                    puzzle.points.lengthBonus
                );
            }


            /*
                Starting-letter bonus.
            */

            if (puzzle.points.startingLetter > 0) {

                addScoreLine(
                    `start ≠ ${puzzle.rack[0]}`,
                    puzzle.points.startingLetter
                );
            }


            /*
                Time.
            */

            addScoreLine(
                "time",
                puzzle.points.time
            );


            solution.appendChild(breakdown);

            div.appendChild(solution);
        }


        /*
            Show answers after time is up.
        */

        if (!gameActive) {

            const answersContainer =
                document.createElement("div");

            answersContainer.className =
                "answers-container";


            const button =
                document.createElement("button");

            button.className =
                "show-answers";

            button.textContent =
                "Show answers";


            const answerDiv =
                document.createElement("div");

            answerDiv.className =
                "answers";

            answerDiv.style.display =
                "none";


            button.addEventListener("click", () => {

                /*
                    Shortest words first, then alphabetical.
                */

                const sorted =
                    [...puzzle.answers].sort((a, b) => {

                        if (a.length !== b.length) {
                            return a.length - b.length;
                        }

                        return a.localeCompare(b);
                    });

                answerDiv.textContent =
                    sorted.join(", ");

                answerDiv.style.display =
                    "block";

                button.style.display =
                    "none";
            });


            answersContainer.appendChild(button);
            answersContainer.appendChild(answerDiv);

            div.appendChild(answersContainer);
        }


        container.appendChild(div);
    });
}


/* ============================================================
   MESSAGE
   ============================================================ */

let messageTimeout = null;


function showMessage(text) {

    const message =
        document.getElementById("message");

    message.textContent =
        text;

    clearTimeout(messageTimeout);

    messageTimeout =
        setTimeout(() => {
            message.textContent = "";
        }, 1000);
}


/* ============================================================
   POINT CALCULATION
   ============================================================ */

function calculatePoints(puzzle, word) {

    /*
        BASE
    */

    const base =
        25 * Math.round(
            4 * Math.max(
                1,
                8 - Math.log2(puzzle.answers.length)
            )
        );


    /*
        SHORTEST
    */

    let shortestLength = Infinity;

    for (const answer of puzzle.answers) {

        shortestLength =
            Math.min(
                shortestLength,
                answer.length
            );
    }

    const shortest =
        word.length === shortestLength
            ? 250
            : 0;


    /*
        LENGTH BONUS
    */

    const lengthBonus =
        word.length !== shortestLength
            ? Math.max(
                0,
                150 - 25 * (word.length - 7)
            )
            : 0;


    /*
        STARTING LETTER
    */

    const startingLetter =
        word[0] !== puzzle.rack[0]
            ? 250
            : 0;


    /*
        TIME
    */

    const time =
        Math.ceil(
            20 * timeRemaining / 120
        );


    /*
        TOTAL
    */

    const total =
        base +
        shortest +
        lengthBonus +
        startingLetter +
        time;


    return {
        total: total,
        base: base,
        shortest: shortest,
        lengthBonus: lengthBonus,
        startingLetter: startingLetter,
        time: time
    };
}


/* ============================================================
   SUBMIT WORD
   ============================================================ */

function submitWord() {

    if (!gameActive) {
        return;
    }

    if (currentWord.length === 0) {
        return;
    }


    const word =
        currentWord;


    /*
        Clear typing area immediately.
    */

    currentWord = "";

    updateCurrentWord();


    /*
        Clear hidden input immediately as well.
    */

    hiddenInput.value = "";


    /* ========================================================
       1. IS IT A WORD?
       ======================================================== */

    if (!wordSet.has(word)) {

        showMessage("Not a word");

        return;
    }


    /* ========================================================
       2. IS IT AN ANSWER TO ANY PUZZLE?
       ======================================================== */

    let isCommonAnswer = false;

    for (const puzzle of puzzles) {

        if (puzzle.answers.includes(word)) {
            isCommonAnswer = true;
            break;
        }
    }


    /*
        Rare = in words_alpha.txt but not in CEL22.
    */

    const isRareWord =
        !wordList.includes(word);


    /*
        Bonus words solve a puzzle using the same
        subsequence rule.
    */

    const bonusPuzzles =
        isRareWord
            ? puzzles.filter(puzzle =>
                word.length >= puzzle.rack.length &&
                substr(puzzle.rack, word)
            )
            : [];


    if (bonusPuzzles.length > 0) {

        let showedBonus = false;

        for (const puzzle of bonusPuzzles) {

            /*
                Don't show a bonus word on a puzzle that
                already has a correct answer.
            */

            if (puzzle.solved) {
                continue;
            }

            puzzle.bonusWord =
                word;

            showedBonus = true;
        }


        if (showedBonus) {

            renderPuzzles();

            showMessage(
                `(${word}) bonus word`
            );

        } else {

            showMessage(
                "No improvement (bonus word)"
            );
        }

        return;
    }


    if (!isCommonAnswer) {

        showMessage("Not an answer");

        return;
    }


    /* ========================================================
       3. UPDATE EVERY PUZZLE THAT THIS WORD IMPROVES
       ======================================================== */

    let totalImprovement = 0;

    let improvedAny = false;


    for (const puzzle of puzzles) {

        if (!puzzle.answers.includes(word)) {
            continue;
        }


        const newPoints =
            calculatePoints(
                puzzle,
                word
            );


        const oldTotal =
            puzzle.points === 0
                ? 0
                : puzzle.points.total;


        const improvement =
            newPoints.total - oldTotal;


        if (improvement > 0) {

            puzzle.solution =
                word;

            puzzle.points =
                newPoints;

            puzzle.solved =
                true;

            /*
                A correct answer replaces/hides
                any previous bonus word.
            */

            puzzle.bonusWord =
                null;

            totalImprovement +=
                improvement;

            improvedAny =
                true;
        }
    }


    if (!improvedAny) {

        showMessage(
            "No improvement"
        );

        return;
    }


    score +=
        totalImprovement;

    updateScore();

    renderPuzzles();

    showMessage(
        `+${totalImprovement} (${word})`
    );
}


/* ============================================================
   KEYBOARD / TEXT INPUT
   ============================================================ */

const hiddenInput =
    document.getElementById("hidden-input");


function focusHiddenInput() {

    if (gameActive) {

        hiddenInput.focus({
            preventScroll: true
        });
    }
}


/*
    Tapping/clicking anywhere in the game area
    brings the keyboard back if it was dismissed.
*/

document.getElementById("game")
    .addEventListener(
        "click",
        focusHiddenInput
    );


/*
    If focus is lost for any reason while the game is
    still active, try to reclaim it.

    Because the input is now position: fixed, this
    should no longer scroll the game back to the top.
*/

hiddenInput.addEventListener(
    "blur",
    () => {

        if (gameActive) {

            setTimeout(
                focusHiddenInput,
                0
            );
        }
    }
);


/*
    Letters and backspaces.
*/

hiddenInput.addEventListener(
    "input",
    () => {

        if (!gameActive) {

            hiddenInput.value = "";

            return;
        }


        const filtered =
            hiddenInput.value
                .replace(/[^a-zA-Z]/g, "")
                .toUpperCase();


        if (hiddenInput.value !== filtered) {

            hiddenInput.value =
                filtered;
        }


        currentWord =
            filtered;

        updateCurrentWord();
    }
);


/*
    Enter or Space submits.
*/

hiddenInput.addEventListener(
    "keydown",
    event => {

        if (!gameActive) {
            return;
        }


        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            submitWord();

            hiddenInput.value = "";
        }
    }
);


/* ============================================================
   TIMER
   ============================================================ */

function startTimer() {

    /*
        Clear any old timer.
    */

    if (timerInterval !== null) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;
    }


    timeRemaining =
        120;

    updateTimer();


    timerInterval =
        setInterval(
            () => {

                timeRemaining--;

                if (timeRemaining < 0) {

                    timeRemaining =
                        0;
                }

                updateTimer();


                if (timeRemaining === 0) {

                    endGame();
                }

            },
            1000
        );
}


/* ============================================================
   END GAME
   ============================================================ */

function endGame() {

    /*
        Prevent this from doing anything twice.
    */

    if (!gameActive) {
        return;
    }

    gameActive =
        false;


    if (timerInterval !== null) {

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;
    }


    currentWord =
        "";

    updateCurrentWord();


    hiddenInput.value =
        "";

    hiddenInput.blur();


    /*
        Re-render to show "Show answers" buttons.
    */

    renderPuzzles();


    document.getElementById(
        "game-over"
    ).style.display =
        "block";


    document.getElementById(
        "final-score"
    ).textContent =
        `Final score: ${score}`;
}


/* ============================================================
   START GAME
   ============================================================ */

async function startGame() {

    /*
        Load word lists only once.
    */

    if (wordList.length === 0) {

        const commonResponse =
            await fetch("CEL22.txt");

        if (!commonResponse.ok) {

            throw new Error(
                "Could not load CEL22.txt"
            );
        }


        const rareResponse =
            await fetch("words_alpha.txt");

        if (!rareResponse.ok) {

            throw new Error(
                "Could not load words_alpha.txt"
            );
        }


        const commonText =
            await commonResponse.text();

        const rareText =
            await rareResponse.text();


        wordList =
            [...new Set(
                commonText
                    .split(/\r?\n/)
                    .map(
                        word =>
                            word
                                .trim()
                                .toUpperCase()
                    )
                    .filter(
                        word =>
                            /^[A-Z]+$/.test(word)
                    )
            )];


        wordSet =
            new Set(
                rareText
                    .split(/\r?\n/)
                    .map(
                        word =>
                            word
                                .trim()
                                .toUpperCase()
                    )
                    .filter(
                        word =>
                            /^[A-Z]+$/.test(word)
                    )
            );
    }


    /*
        Reset game state.
    */

    puzzles =
        generatePuzzles();

    score =
        0;

    currentWord =
        "";

    gameActive =
        true;


    /*
        Hide game-over display.
    */

    document.getElementById(
        "game-over"
    ).style.display =
        "none";


    updateScore();

    updateCurrentWord();

    renderPuzzles();

    startTimer();


    hiddenInput.value =
        "";

    focusHiddenInput();
}
